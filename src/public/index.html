<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Socket.IO Chat</title>
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22></text></svg>"
        />
        <!-- <link rel="stylesheet" href="css/output.css" /> -->
        <link rel="stylesheet" href="./css/input.css" />
    </head>
    <body class="flex w-screen bg-slate-900">
        <!-- flex-1 shrinks -->
        <main class="m-4 flex h-screen flex-1 flex-col rounded-md bg-amber-600 text-white">
            <header class="relative flex flex-shrink-0 items-center justify-center">
                <h1 class="text-center">Yatzee Game med Socket.IO</h1>
                <button class="absolute right-0" id="outside-chat-btn">Chat</button>
            </header>
            <div class="flex min-h-0 flex-1 bg-red-700">
                <div class="w-64 flex-shrink-0 bg-yellow-500" id="yatzee-game-container"></div>
                <div class="flex-1 bg-orange-500" id="three-container"></div>
            </div>
        </main>

        <!-- Chatt till sidan -->
        <!-- ? Ha som footer istället -->
        <!-- w-24 -->
        <aside
            class="border-md my-4 rounded-l-md bg-slate-400 p-2 transition-all delay-300 duration-150"
            id="sidebar-chat-container"
        >
            <div class="grid grid-cols-5 items-center">
                <header class="col-span-4"><h1>Chat</h1></header>
                <button class="size-fit border-black bg-red-500" id="chat-toggle">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.8"
                        stroke="currentColor"
                        class="size-6"
                    >
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <h2>Chat meddelanden</h2>
            <div class="flex h-screen flex-col rounded-md p-4">
                <div class="my-4 flex-1 rounded-md bg-gray-300 p-2" id="message-container">
                    <div id="display-user">display user</div>
                    <div id="display-message">display message</div>
                </div>

                <form class="flex gap-2" id="message-form">
                    <div class="flex flex-col gap-2">
                        <input type="text" id="user-input" placeholder="Skriv ditt namn..." autofocus />
                        <input type="text" id="message-input" placeholder="Skriv meddelande" />
                    </div>
                    <button class="rounded-full border border-black bg-blue-500" type="submit">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            stroke="currentColor"
                            class="m-2 size-8 rounded-full"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5"
                            />
                        </svg>
                    </button>
                </form>
            </div>

            <div id="welcome-message"></div>
        </aside>

        <!-- <script src="/socket.io/socket.io.js"></script> -->
        <script type="module" src="client.ts"></script>
    </body>
</html>
