<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Socket.IO Chat</title>
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22></text></svg>"
        />
        <!-- <link rel="stylesheet" href="css/output.css" /> -->
        <link rel="stylesheet" href="./css/input.css" />
    </head>
    <body class="flex bg-slate-900">
        <main class="w-full bg-amber-600 text-white">
            <header><h1>Yatzee Game med Socket.IO</h1></header>
            <div class="bg-yellow-500" id="yatzee-game-container"></div>
            <div class="bg-orange-500" id="three-container"></div>
        </main>

        <!-- Chatt till sidan -->
        <aside
            class="border-md w-24 rounded-md bg-slate-400 p-4 transition-all delay-300 duration-150"
            id="sidebar-chat-container"
        >
            <header><h1>Chat</h1></header>

            <form id="message-form">
                <input type="text" id="user-input" placeholder="Skriv ditt namn..." autofocus />
                <input type="text" id="message-input" placeholder="Skriv meddelande" />
                <button class="rounded-full border border-black bg-blue-500" type="submit">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                        class="m-2 size-8 rounded-full"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5"
                        />
                    </svg>
                </button>
            </form>

            <div id="welcome-message"></div>

            <h2>Chat meddelanden</h2>
            <div class="bg-slate-300" id="message-container">
                <div id="display-user">display user</div>
                <div id="display-message">display message</div>
            </div>
        </aside>

        <!-- <script src="/socket.io/socket.io.js"></script> -->
        <script type="module" src="client.ts"></script>
    </body>
</html>
